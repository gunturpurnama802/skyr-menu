<!DOCTYPE html>
<html lang="id" class="h-full antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0061a6">
  <title>SKYR — Menu</title>
  <link rel="icon" href="favicon.ico">

  <!-- Tailwind CSS via CDN (agar semua class Tailwind bawaan Next.js 100% presisi) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#f8fafc",
            foreground: "#1f2937",
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Lottie Web Player -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <!-- Custom animations & styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-full flex flex-col bg-[#f8fafc] text-[#1f2937]">

  <!-- ==================== 1. WELCOME SCREEN ==================== -->
  <div
    id="skyr-welcome"
    class="fixed inset-0 z-[9999] flex h-[100dvh] max-h-[100dvh] w-screen flex-col items-center justify-center overflow-hidden bg-[#0061a6] px-6 py-6 text-white overscroll-none touch-none welcome-enter"
    style="height: 100dvh; min-height: -webkit-fill-available;"
  >
    <!-- Background swirl — slow drift, halus -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      <div class="animate-welcome-glow absolute left-1/2 top-[38%] h-[420px] w-[680px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-white/[0.07] blur-[70px]"></div>
      <div class="animate-welcome-glow absolute left-1/2 top-[42%] h-[360px] w-[520px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-white/[0.05] blur-[60px]" style="animation-delay: 1.2s;"></div>
      <svg
        class="animate-welcome-bg absolute inset-0 h-full w-full"
        viewBox="0 0 400 800"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -20 80 C 60 40, 140 120, 220 70 S 360 10, 420 90" stroke-opacity="0.14" stroke-width="1.4" />
          <path d="M -20 140 C 70 110, 130 200, 240 160 S 360 90, 420 150" stroke-opacity="0.10" stroke-width="1.2" />
          <path d="M -20 200 C 50 170, 160 260, 260 230 S 380 170, 420 220" stroke-opacity="0.12" stroke-width="1.3" />
          <path d="M -20 300 C 80 240, 180 340, 280 300 S 380 260, 420 310" stroke-opacity="0.11" stroke-width="1.1" />
          <path d="M -20 400 C 60 360, 150 460, 250 420 S 360 370, 420 420" stroke-opacity="0.09" stroke-width="1.2" />
          <path d="M -20 520 C 90 470, 170 560, 270 530 S 370 490, 420 540" stroke-opacity="0.10" stroke-width="1.0" />
          <path d="M -20 640 C 70 600, 160 700, 260 670 S 370 620, 420 680" stroke-opacity="0.11" stroke-width="1.3" />
          <path d="M 40 0 C 90 80, 70 220, 140 320 S 180 520, 240 620 S 320 750, 360 800" stroke-opacity="0.07" stroke-width="1.5" />
          <path d="M 160 0 C 180 100, 220 240, 180 360 S 260 580, 300 700" stroke-opacity="0.06" stroke-width="1.2" />
          <path d="M 280 0 C 300 90, 320 200, 300 340 S 340 560, 380 680" stroke-opacity="0.07" stroke-width="1.1" />
        </g>
        <g fill="none" stroke="white" stroke-opacity="0.04" stroke-width="8">
          <path d="M -20 110 C 80 70, 180 140, 260 110 S 380 60, 420 120" />
          <path d="M -20 360 C 100 320, 200 420, 320 380 S 420 360, 420 400" />
          <path d="M -20 580 C 80 540, 180 640, 300 610" />
        </g>
      </svg>
    </div>

    <!-- Konten judul, maskot lottie & tombol masuk -->
    <div class="relative z-10 flex w-full max-w-[360px] flex-col items-center text-center">
      <div class="animate-welcome-title will-change-transform">
        <h1 class="bg-gradient-to-b from-white to-white/90 bg-clip-text text-[64px] font-black tracking-[0.18em] text-transparent drop-shadow-[0_2px_12px_rgba(255,255,255,0.18)] sm:text-[82px] lg:text-[96px]">
          SKYR
        </h1>
        <div class="mx-auto mt-2 h-px bg-white/30" style="width: 68%;"></div>
      </div>
      <p class="animate-welcome-sub mt-3 text-xs font-semibold tracking-[0.22em] text-white/75 sm:text-sm">
        HOME OF THE MONSTER
      </p>

      <div class="animate-welcome-sub relative mt-8 flex flex-col items-center" style="animation-delay: 0.85s;">
        <!-- Waving Mascot (Lottie Player) -->
        <div class="relative z-0 -mb-2 sm:-mb-4">
          <div class="relative aspect-[1852/1121] w-[160px] drop-shadow-[0_8px_16px_rgba(0,0,0,0.24)] sm:w-[220px]" aria-hidden="true">
            <img id="mascot-fallback" src="mascot.webp" alt="SKYR Mascot" class="absolute inset-0 h-full w-full object-contain object-bottom">
            <div id="mascot-lottie" class="absolute inset-0"></div>
          </div>
        </div>

        <!-- Tombol Masuk / LIHAT MENU -->
        <button
          id="welcome-enter-btn"
          type="button"
          aria-label="Lihat Menu"
          class="animate-welcome-btn group relative z-10 flex min-h-[54px] min-w-[210px] cursor-pointer select-none items-center justify-center overflow-hidden rounded-full bg-white px-10 py-3.5 text-sm font-black tracking-[0.14em] text-[#0061a6] shadow-[0_8px_0_rgba(0,0,0,0.18),0_12px_24px_rgba(0,0,0,0.15)] transition-[transform,box-shadow] duration-300 will-change-transform hover:scale-[1.02] hover:shadow-[0_10px_0_rgba(0,0,0,0.18),0_16px_32px_rgba(0,0,0,0.18)] active:translate-y-[2px] active:shadow-[0_4px_0_rgba(0,0,0,0.18)] sm:min-w-[230px] sm:px-12 sm:py-4 sm:text-[15px]"
          style="-webkit-tap-highlight-color: transparent; touch-action: manipulation;"
        >
          <span class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-[#0061a6]/10 to-transparent transition-transform duration-[1.2s] ease-out group-hover:translate-x-full" aria-hidden="true"></span>
          <span class="relative">LIHAT MENU</span>
          <span class="relative ml-2 text-base leading-none transition-transform duration-300 group-hover:translate-x-0.5">→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. MAIN CUSTOMER MENU ==================== -->
  <div class="relative flex min-h-dvh flex-col bg-[#0061a6] overflow-hidden">
    <!-- Background swirl -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      <svg class="absolute inset-0 h-full w-full" viewBox="0 0 400 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -20 80 C 60 40, 140 120, 220 70 S 360 10, 420 90" stroke-opacity="0.14" stroke-width="1.4" />
          <path d="M -20 140 C 70 110, 130 200, 240 160 S 360 90, 420 150" stroke-opacity="0.10" stroke-width="1.2" />
          <path d="M -20 200 C 50 170, 160 260, 260 230 S 380 170, 420 220" stroke-opacity="0.12" stroke-width="1.3" />
          <path d="M -20 300 C 80 240, 180 340, 280 300 S 380 260, 420 310" stroke-opacity="0.11" stroke-width="1.1" />
          <path d="M -20 400 C 60 360, 150 460, 250 420 S 360 370, 420 420" stroke-opacity="0.09" stroke-width="1.2" />
          <path d="M -20 520 C 90 470, 170 560, 270 530 S 370 490, 420 540" stroke-opacity="0.10" stroke-width="1.0" />
          <path d="M -20 640 C 70 600, 160 700, 260 670 S 370 620, 420 680" stroke-opacity="0.11" stroke-width="1.3" />
          <path d="M 40 0 C 90 80, 70 220, 140 320 S 180 520, 240 620 S 320 750, 360 800" stroke-opacity="0.07" stroke-width="1.5" />
          <path d="M 160 0 C 180 100, 220 240, 180 360 S 260 580, 300 700" stroke-opacity="0.06" stroke-width="1.2" />
          <path d="M 280 0 C 300 90, 320 200, 300 340 S 340 560, 380 680" stroke-opacity="0.07" stroke-width="1.1" />
        </g>
        <g fill="none" stroke="white" stroke-opacity="0.04" stroke-width="8">
          <path d="M -20 110 C 80 70, 180 140, 260 110 S 380 60, 420 120" />
          <path d="M -20 360 C 100 320, 200 420, 320 380 S 420 360, 420 400" />
          <path d="M -20 580 C 80 540, 180 640, 300 610" />
        </g>
      </svg>
    </div>

    <!-- Filter + bucket liquid glass — fixed saat scroll -->
    <div class="fixed left-0 right-0 top-3 z-20 px-4 sm:px-6 pointer-events-none">
      <div
        id="floating-topbar"
        class="pointer-events-auto mx-auto flex max-w-fit items-center gap-2 rounded-full border p-1.5 pr-1.5 transition-all duration-300 ease-out sm:gap-3 sm:p-2 bg-white/14 backdrop-blur-xl border-white/20 shadow-[0_8px_32px_rgba(0,0,0,0.16),0_4px_12px_rgba(0,0,0,0.08),inset_0_1px_0_rgba(255,255,255,0.28)] scale-100"
      >
        <div class="min-w-0 flex-1">
          <div
            id="category-container"
            class="flex gap-1.5 overflow-x-auto scrollbar-none"
            style="scrollbar-width: none;"
            role="tablist"
            aria-label="Filter kategori"
          >
            <!-- Diisi oleh JS (kategori menu) -->
          </div>
        </div>
        <span class="h-7 w-px shrink-0 bg-white/20" aria-hidden="true"></span>
        <button
          id="open-bucket-btn"
          type="button"
          aria-label="Buka catatan"
          class="relative inline-flex shrink-0 items-center gap-1.5 rounded-full bg-[#0061a6] px-3.5 py-2 text-sm font-bold text-white shadow-[0_4px_12px_rgba(0,0,0,0.12)] transition hover:bg-[#00548f] active:scale-[0.97] sm:gap-2 sm:px-4 sm:py-2.5"
        >
          <i data-lucide="shopping-bag" class="w-4 h-4 shrink-0"></i>
          <span class="hidden sm:inline">Catatan</span>
          <span id="bucket-badge" class="hidden flex h-5 min-w-5 items-center justify-center rounded-full bg-white px-1.5 text-xs font-bold text-[#0061a6]">0</span>
        </button>
      </div>
    </div>

    <!-- Grid Menu Utama -->
    <section id="menu" class="relative flex-1 pb-6 pt-20 sm:pb-8 sm:pt-24">
      <div class="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8">
        <div id="chat-room-slot"></div>
        <div id="menu-grid" class="mt-1 grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-3 xl:grid-cols-4">
          <!-- Diisi oleh JS (item menu) -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="relative bg-[#0061a6] py-6 text-center text-xs text-white/60 border-t border-white/10">
      © 2026 SKYR. All rights reserved.
    </footer>
  </div>

  <!-- ==================== 3. BUCKET DRAWER (CATATAN PESANAN) ==================== -->
  <div id="bucket-drawer-overlay" class="fixed inset-0 z-40 hidden justify-end" role="dialog" aria-modal="true" aria-label="Catatan">
    <button id="bucket-drawer-backdrop" aria-label="Tutup catatan" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></button>
    <div class="relative flex h-dvh w-full max-w-[420px] flex-col bg-[#f8fafc] shadow-2xl">
      <!-- Header — SKYR blue -->
      <div class="flex items-center justify-between bg-[#0061a6] px-5 py-4 text-white shrink-0">
        <div class="flex items-center gap-3">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15">
            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 class="text-sm font-bold leading-none">Catatan</h2>
            <p id="drawer-total-count" class="text-xs text-white/70">0 item</p>
          </div>
        </div>
        <button id="bucket-drawer-close" aria-label="Close catatan" class="rounded-full bg-white/15 p-2 hover:bg-white/25">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Kertas bergaris + monster notes -->
      <div
        id="bucket-drawer-body"
        class="flex-1 overflow-y-auto px-4 py-5 sm:px-5"
        style="background-color: #fffef5; background-image: repeating-linear-gradient(transparent, transparent 31px, #e7e5e4 31px, #e7e5e4 32px), linear-gradient(to right, #fca5a5 0, #fca5a5 2px, transparent 2px); background-position: 0 0, 44px 0; background-size: 100% 32px, 100% 100%;"
      >
        <!-- Diisi oleh JS -->
      </div>

      <!-- Footer Catatan -->
      <div id="bucket-drawer-footer">
        <!-- Diisi oleh JS -->
      </div>
    </div>
  </div>

  <!-- ==================== 4. MUSIC PLAYER ==================== -->
  <audio id="bg-audio" preload="auto" loop playsinline></audio>
  <button
    id="music-toggle-btn"
    type="button"
    aria-label="Play music"
    title="Play music"
    class="fixed bottom-4 right-4 z-40 flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-[0_4px_16px_rgba(0,0,0,0.15)] ring-1 ring-black/5 transition hover:scale-105 active:scale-95 sm:bottom-6 sm:right-6 sm:h-14 sm:w-14"
  >
    <span
      id="music-spin-wrap"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-[#0061a6] text-white sm:h-12 sm:w-12"
      style="animation-play-state: paused;"
    >
      <i data-lucide="music-2" class="w-4 h-4 sm:hidden"></i>
      <span class="hidden sm:inline-flex" id="music-desktop-slot">
        <i data-lucide="music-2" class="w-5 h-5"></i>
      </span>
    </span>
    <!-- Ping saat butuh interaksi -->
    <span id="music-ping-dot" class="hidden absolute -right-1 -top-1 flex h-3 w-3">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-amber-400 opacity-75"></span>
      <span class="relative inline-flex h-3 w-3 rounded-full bg-amber-500"></span>
    </span>
  </button>

  <!-- Script Aplikasi -->
  <script src="js/app.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
